name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 代码规范
        run: node scripts/style-check.mjs
      - name: Manifest 校验
        run: node scripts/validate-manifest.mjs
      - name: 运行测试
        run: node scripts/test-all.mjs
      - name: 语法检查
        shell: bash
        run: |
          for f in $(find src client test scripts -type f \( -name '*.js' -o -name '*.mjs' \)); do
            node --check "$f"
          done
